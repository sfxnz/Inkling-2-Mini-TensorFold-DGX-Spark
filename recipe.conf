# Inkling-2-Mini (NVFP4/MXFP8 + DFlash2) on a single NVIDIA DGX Spark (1x GB10) with TensorFold v1.3.5+.
# run.sh and stop.sh source this file. Every value is a default: a variable already set in the environment wins.

# Target model pack, pinned by exact commit, shard count, byte sizes, and SHA-256 hashes.
MODEL=${MODEL:-thinkingmachines/Inkling-2-Mini}
REVISION=${REVISION:-c9d028302cd0f035fdf8e7e91f089a4ce94d2195}
SHARDS=${SHARDS:-1}
SHARD_BYTES=${SHARD_BYTES:-19526019168}
MTP_BYTES=${MTP_BYTES:-635801416}
MODEL_SHA256=${MODEL_SHA256:-65e60f51aa1284d4fb022584908c315270334d991828bb774af60584523539d1}
MTP_SHA256=${MTP_SHA256:-7c3b651317f01f73bcf4e1dceba66ef8b7e1a1eac6bc171e882e690a4b10a1d2}
HF_INCLUDE=${HF_INCLUDE:-*.safetensors *.json *.jinja tiktoken/* LICENSE*}
HF_CACHE=${HF_CACHE:-$HOME/.cache/huggingface}

# DFlash2 drafter pack, pinned by exact commit, shard count, byte size, and SHA-256 hash.
# Set DRAFTER="" to run without a drafter.
DRAFTER=${DRAFTER:-incoai/Inkling-2-Mini-DFlash2}
DRAFTER_REVISION=${DRAFTER_REVISION:-4f9088ea66c21f2b99ed657d1941c306b03e84d2}
DRAFTER_SHARDS=${DRAFTER_SHARDS:-1}
DRAFTER_SHARD_BYTES=${DRAFTER_SHARD_BYTES:-989975616}
DRAFTER_SHA256=${DRAFTER_SHA256:-217980ab00d116693fa5946df7bbfd967caf5fac1f529afd541fbd470ddb54ee}
DRAFTER_BITS=${DRAFTER_BITS:-4}

# Engine container. BASE_IMAGE is built from docker/Dockerfile; IMAGE is the patched overlay
# built from docker/Dockerfile.patched with engine-patches/ (0001..0023).
BASE_IMAGE=${BASE_IMAGE:-tf-inkling2:1.3.5}
IMAGE=${IMAGE:-tf-inkling2:m3-p9}
TF_VERSION=${TF_VERSION:-1.3.5}
TF_SHA256=${TF_SHA256:-9223b9fd3d1ab1b3f1a3493990533a2ca41f18404a882e872221fc94487ad65f}

# Serving parameters.
SERVED_NAME=${SERVED_NAME:-inkling-2-mini}
PORT=${PORT:-8000}
CONTEXT=${CONTEXT:-1048576}
PARALLEL=${PARALLEL:-8}
VISION=${VISION:-1}
VIDEO_TOKENS=${VIDEO_TOKENS:-64}
MEMORY_RESERVE_GIB=${MEMORY_RESERVE_GIB:-13.0}
PROMPT_CACHE_GIB=${PROMPT_CACHE_GIB:-}
API_KEY_FILE=${API_KEY_FILE:-}
ENGINE_CACHE=${ENGINE_CACHE-tf-inkling2-cache-135}

# Extra engine environment variables (space-separated VAR=VALUE) and CLI arguments.
EXTRA_ENV=${EXTRA_ENV:-TF_INKLING2_ATTN_FP8=1 TF_INKLING2_PREFILL_TC=1 TF_INKLING2_GATE_FP8=1 TF_QMMF_HALF_BN=1 TF_INKLING2_MOE_WAVES=1 TF_INKLING2_SAMPLED_FP8_HEAD=1}
EXTRA_ARGS=${EXTRA_ARGS:-}

# Host safety gates.
MEM_GATE_GIB=${MEM_GATE_GIB:-108}
MEM_FLOOR_GIB=${MEM_FLOOR_GIB:-8.0}
FORCE=${FORCE:-0}
READY_TIMEOUT=${READY_TIMEOUT:-900}

# Container identity: run.sh and stop.sh manage only containers with this label and name.
LABEL=ai-lab.recipe=inkling2-mini-tensorfold
CONTAINER_NAME=${CONTAINER_NAME:-tf-inkling2}
